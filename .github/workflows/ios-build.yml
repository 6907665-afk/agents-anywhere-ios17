name: ios17-build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain info
        run: |
          set -x
          sw_vers
          xcodebuild -version
          xcodebuild -showsdks || true
          xcrun --sdk iphoneos --show-sdk-version || true

      - name: Build (unsigned)
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          cd ios 2>/dev/null || true
          xcodebuild \
            -project "Agents Anywhere/Agents Anywhere.xcodeproj" \
            -scheme "Agents Anywhere" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            IPHONEOS_DEPLOYMENT_TARGET=17.0 \
            -quiet \
            build 2>&1 | tee "$RUNNER_TEMP/build.log" || true
          echo "=== ERROR SUMMARY ==="
          grep -E "error:" "$RUNNER_TEMP/build.log" | sort -u | head -200 || true
          echo "=== TAIL ==="
          tail -60 "$RUNNER_TEMP/build.log" || true

      - name: Package IPA
        if: steps.build.outcome == 'success'
        run: |
          set -e
          cd ios 2>/dev/null || true
          APP=$(find "$RUNNER_TEMP/dd/Build/Products/Release-iphoneos" -maxdepth 1 -name "*.app" | head -1)
          echo "APP=$APP"
          mkdir -p "$RUNNER_TEMP/pkg/Payload"
          cp -R "$APP" "$RUNNER_TEMP/pkg/Payload/"
          cd "$RUNNER_TEMP/pkg"
          zip -qry "$RUNNER_TEMP/AgentsAnywhere-ios17.ipa" Payload
          ls -la "$RUNNER_TEMP/AgentsAnywhere-ios17.ipa"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-output
          path: |
            ${{ runner.temp }}/AgentsAnywhere-ios17.ipa
            ${{ runner.temp }}/build.log
          if-no-files-found: warn
